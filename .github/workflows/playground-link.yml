name: Add Playground link

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  delete:

permissions:
  contents: read

concurrency:
  group: playground-link-${{ github.event_name }}-${{ github.ref_name || github.event.ref || github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  update-pr-description:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add Playground link to PR description
        uses: actions/github-script@v9
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const markerStart = '<!-- playground-link:start -->';
            const markerEnd = '<!-- playground-link:end -->';
            const markerPattern = /<!-- (?:[a-z0-9-]+-)?playground-link:start -->[\s\S]*?<!-- (?:[a-z0-9-]+-)?playground-link:end -->/;
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const headRef = process.env.HEAD_REF;
            const currentBody = context.payload.pull_request.body || '';
            const playgroundUrl = `https://akirk.github.io/playground-step-library/?redir=1&step[0]=installPlugin&url[0]=advanced-custom-fields&step[1]=installPlugin&url[1]=github.com/${owner}/${repo}/tree/${headRef}`;
            const playgroundSection = [
              markerStart,
              '## Test this PR in WordPress Playground',
              '',
              'You can test this pull request directly in WordPress Playground:',
              '',
              `[Launch WordPress Playground](${playgroundUrl})`,
              '',
              'This will install and activate ACF and the plugin with the changes from this PR.',
              markerEnd,
            ].join('\n');

            const body = markerPattern.test(currentBody)
              ? currentBody.replace(markerPattern, playgroundSection)
              : [currentBody.trimEnd(), playgroundSection].filter(Boolean).join('\n\n');

            if (body !== currentBody) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number,
                body,
              });
            }

  remove-stale-pr-links:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove stale PR links
        uses: actions/github-script@v9
        env:
          BRANCH_NAME: ${{ github.event.ref }}
        with:
          script: |
            const markerPattern = /<!-- (?:[a-z0-9-]+-)?playground-link:start -->[\s\S]*?<!-- (?:[a-z0-9-]+-)?playground-link:end -->/;
            const { owner, repo } = context.repo;
            const head = `${owner}:${process.env.BRANCH_NAME}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'all',
              head,
              per_page: 100,
            });

            for (const pull of pulls) {
              const currentBody = pull.body || '';
              if (!markerPattern.test(currentBody)) {
                continue;
              }

              const body = currentBody
                .replace(markerPattern, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                body,
              });
            }
