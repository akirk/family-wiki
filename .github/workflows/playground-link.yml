name: Add Playground link

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  delete:

permissions:
  contents: read

concurrency:
  group: playground-link-${{ github.event_name }}-${{ github.ref_name || github.event.ref || github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  update-pr-description:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add Playground link to PR description
        uses: actions/github-script@v9
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const markerStart = '<!-- playground-link:start -->';
            const markerEnd = '<!-- playground-link:end -->';
            const markerPattern = /<!-- (?:[a-z0-9-]+-)?playground-link:start -->[\s\S]*?<!-- (?:[a-z0-9-]+-)?playground-link:end -->/;
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const headRef = process.env.HEAD_REF;

            let hasBlueprint = false;
            try {
              await github.rest.repos.getContent({
                owner,
                repo,
                path: 'blueprint.json',
                ref: headRef,
              });
              hasBlueprint = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const currentBody = context.payload.pull_request.body || '';
            let body = currentBody;

            if (hasBlueprint) {
              const playgroundUrl = `https://playground.wordpress.net/?blueprint-url=https://raw.githubusercontent.com/${owner}/${repo}/refs/heads/${headRef}/blueprint.json`;
              const playgroundSection = [
                markerStart,
                '## WordPress Playground',
                '',
                'Test this PR in WordPress Playground:',
                '',
                playgroundUrl,
                markerEnd,
              ].join('\n');

              body = markerPattern.test(currentBody)
                ? currentBody.replace(markerPattern, playgroundSection)
                : [currentBody.trimEnd(), playgroundSection].filter(Boolean).join('\n\n');
            } else if (markerPattern.test(currentBody)) {
              body = currentBody
                .replace(markerPattern, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
            }

            if (body !== currentBody) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number,
                body,
              });
            }

  remove-stale-pr-links:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove stale PR links
        uses: actions/github-script@v9
        env:
          BRANCH_NAME: ${{ github.event.ref }}
        with:
          script: |
            const markerPattern = /<!-- (?:[a-z0-9-]+-)?playground-link:start -->[\s\S]*?<!-- (?:[a-z0-9-]+-)?playground-link:end -->/;
            const { owner, repo } = context.repo;
            const head = `${owner}:${process.env.BRANCH_NAME}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'all',
              head,
              per_page: 100,
            });

            for (const pull of pulls) {
              const currentBody = pull.body || '';
              if (!markerPattern.test(currentBody)) {
                continue;
              }

              const body = currentBody
                .replace(markerPattern, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                body,
              });
            }
